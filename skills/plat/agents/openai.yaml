interface:
  display_name: "Plat"
  short_description: "Fast autonomous engineering control layer with selective Brain review"
  default_prompt: "Use Plat as a lightweight autonomous engineering control layer. Preserve exact task scope in a compact task capsule, solve directly from current repository/runtime evidence, use DIRECT/STANDARD/ESCALATED with hard stopping conditions, keep normal work single-agent, monitor elapsed time against meaningful progress, and invoke at most one stronger read-only Brain reviewer or one specialist skill only when evidence proves it is needed. Select worker/Brain by capability tier available in the current host rather than hard-coding model names."
