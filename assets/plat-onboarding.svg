<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f3efe4"/>
<rect x="18" y="18" width="1164" height="584" rx="18" fill="#fffdf7" stroke="#4d5d54" stroke-width="4"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" shape-rendering="crispEdges">
  <text x="54" y="68" font-size="27" font-weight="700" fill="#2f4238">ONBOARDING = PREFERENCES, NOT CONTROL</text>
  <text x="54" y="98" font-size="13" fill="#6d7d73">three quick choices personalize Plat; the task still decides engineering depth</text>

  <!-- p01 -->
  <g transform="translate(72 166)">
    <rect x="32" y="84" width="94" height="76" fill="#748fa0"/>
    <rect x="40" y="20" width="78" height="68" fill="#e4b78d"/>
    <rect x="34" y="14" width="90" height="15" fill="#453831"/>
    <rect x="34" y="28" width="12" height="40" fill="#453831"/>
    <rect x="112" y="28" width="12" height="40" fill="#453831"/>
    <rect x="58" y="44" width="8" height="8" fill="#29372f"/>
    <rect x="92" y="44" width="8" height="8" fill="#29372f"/>
    <rect x="73" y="67" width="16" height="4" fill="#805947"/>
    <rect x="22" y="112" width="20" height="12" fill="#e4b78d"/>
    <rect x="118" y="112" width="20" height="12" fill="#e4b78d"/>
    <rect x="44" y="160" width="30" height="34" fill="#3e4d55"/>
    <rect x="86" y="160" width="30" height="34" fill="#3e4d55"/>
    <rect x="38" y="190" width="40" height="12" fill="#2f383c"/>
    <rect x="82" y="190" width="40" height="12" fill="#2f383c"/>
    <text x="44" y="232" font-size="13" font-weight="700" fill="#2f4238">P-01</text>
    <text x="18" y="252" font-size="10" fill="#6d7d73">asks only about you</text>
  </g>

  <!-- Q1 -->
  <g transform="translate(258 136)">
    <rect width="270" height="150" rx="9" fill="#e8f0e5" stroke="#6f8273" stroke-width="3"/>
    <text x="18" y="30" font-size="12" font-weight="700" fill="#3d5845">1 / ROLE</text>
    <text x="18" y="54" font-size="9" fill="#65766a">what do you mainly work on?</text>
    <rect x="18" y="72" width="70" height="24" rx="4" fill="#d6e6d6"/><text x="31" y="88" font-size="8" fill="#3d5845">BACKEND</text>
    <rect x="96" y="72" width="74" height="24" rx="4" fill="#fffdf7"/><text x="108" y="88" font-size="8" fill="#4d5d54">FRONTEND</text>
    <rect x="178" y="72" width="72" height="24" rx="4" fill="#fffdf7"/><text x="190" y="88" font-size="8" fill="#4d5d54">FULLSTACK</text>
    <text x="18" y="122" font-size="8" fill="#65766a">+ mobile · AI · design · platform · data</text>
  </g>

  <!-- Q2 -->
  <g transform="translate(554 136)">
    <rect width="270" height="150" rx="9" fill="#e3edf6" stroke="#6d8394" stroke-width="3"/>
    <text x="18" y="30" font-size="12" font-weight="700" fill="#425d70">2 / EXPERIENCE</text>
    <text x="18" y="54" font-size="9" fill="#708596">how much background should Plat assume?</text>
    <rect x="18" y="76" width="68" height="26" rx="4" fill="#fffdf7"/><text x="30" y="93" font-size="8" fill="#425d70">BEGINNER</text>
    <rect x="96" y="76" width="82" height="26" rx="4" fill="#d9e6ef"/><text x="107" y="93" font-size="8" fill="#425d70">INTERMEDIATE</text>
    <rect x="188" y="76" width="64" height="26" rx="4" fill="#fffdf7"/><text x="200" y="93" font-size="8" fill="#425d70">ADVANCED</text>
  </g>

  <!-- Q3 -->
  <g transform="translate(850 136)">
    <rect width="290" height="150" rx="9" fill="#eee4f3" stroke="#876f91" stroke-width="3"/>
    <text x="18" y="30" font-size="12" font-weight="700" fill="#654e6e">3 / RESPONSE STYLE</text>
    <text x="18" y="54" font-size="9" fill="#817087">how much explanation do you want?</text>
    <rect x="18" y="76" width="72" height="26" rx="4" fill="#dfd2e4"/><text x="30" y="93" font-size="8" fill="#654e6e">CONCISE</text>
    <rect x="100" y="76" width="72" height="26" rx="4" fill="#fffdf7"/><text x="114" y="93" font-size="8" fill="#654e6e">BALANCED</text>
    <rect x="182" y="76" width="90" height="26" rx="4" fill="#fffdf7"/><text x="193" y="93" font-size="8" fill="#654e6e">EXPLANATORY</text>
  </g>

  <!-- optional -->
  <g transform="translate(258 316)">
    <rect width="882" height="74" rx="9" fill="#f3e7d7" stroke="#987a5d" stroke-width="2"/>
    <text x="18" y="29" font-size="11" font-weight="700" fill="#705239">OPTIONAL · FAMILIAR STACK</text>
    <text x="18" y="53" font-size="9" fill="#8a745e">Python · React · Flutter · AWS · Postgres ... helps explanation/search shortcuts only</text>
  </g>

  <!-- fixed priorities -->
  <g transform="translate(258 420)">
    <rect width="882" height="116" rx="9" fill="#edf3e9" stroke="#738477" stroke-width="3"/>
    <text x="18" y="30" font-size="12" font-weight="700" fill="#304239">NOT A QUESTION · PLAT'S FIXED PRIORITY</text>
    <text x="18" y="58" font-size="11" fill="#3d5845">correctness + required safety first</text>
    <text x="18" y="80" font-size="11" fill="#3d5845">then minimize tokens · tool calls · rereads · repair turns · wall time</text>
    <text x="18" y="100" font-size="9" fill="#65766a">"go deep" does not force expensive specialist routing when the task does not need it</text>
  </g>

  <text x="54" y="574" font-size="10" fill="#718078">install creates only ~/.plat/profile.md · no project profile · upgrades keep your preferences</text>
</g>
</svg>