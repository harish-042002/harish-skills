<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f3efe4"/>
<rect x="18" y="18" width="1164" height="684" rx="18" fill="#fffdf7" stroke="#4d5d54" stroke-width="4"/>
