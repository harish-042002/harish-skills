<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#f4f0e6"/>
<rect x="22" y="22" width="1156" height="636" rx="18" fill="#fffdf7" stroke="#506158" stroke-width="4"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" shape-rendering="crispEdges">
<text x="58" y="72" font-size="31" font-weight="700" fill="#304239">PLAT TEAM</text>
