<text x="380" y="166" font-size="12" fill="#718078">NEW ENGINEERING REQUEST</text>
<text x="380" y="199" font-size="20" font-weight="700" fill="#304239">understand → assemble → execute → prove</text>
<text x="380" y="224" font-size="12" fill="#6b7a71">Plat chooses capability + depth before loading specialist context.</text>

<!-- router/coordinator -->
