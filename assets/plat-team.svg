  <circle cx="1033" cy="68" r="6" fill="#68a876"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="1048" y="72" font-size="11" fill="#506459">READY</text>

  <!-- incoming task HUD -->
