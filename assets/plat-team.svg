 <rect x="80" y="78" width="18" height="5" fill="#815c48"/>
 <text x="42" y="196" font-size="14" font-weight="700" fill="#304239">P-01</text>
 <text x="20" y="216" font-size="10" fill="#718078">ROUTER + INTEGRATOR</text>
</g>

