<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#090d1a"/>
  <rect x="18" y="18" width="1164" height="394" rx="18" fill="#10172a" stroke="#273454" stroke-width="4"/>
  <g font-family="monospace" shape-rendering="crispEdges">
    <text x="56" y="68" fill="#ff6bd6" font-size="22" font-weight="700">WHY PLAT?</text>
    <text x="56" y="94" fill="#8797b8" font-size="13">not “more prompt” — better engineering context economics</text>

    <g transform="translate(56 126)">
      <rect width="250" height="206" rx="10" fill="#151d35" stroke="#7df9ff" stroke-width="3"/>
      <rect x="20" y="20" width="36" height="36" fill="#7df9ff"/>
      <rect x="28" y="28" width="20" height="20" fill="#151d35"/>
      <text x="74" y="45" fill="#7df9ff" font-size="17" font-weight="700">ADAPT</text>
      <text x="20" y="90" fill="#e8edff" font-size="14">small task</text>
      <text x="20" y="114" fill="#51f0a5" font-size="14">→ small context</text>
      <text x="20" y="150" fill="#e8edff" font-size="14">hard task</text>
      <text x="20" y="174" fill="#ffcf5c" font-size="14">→ specialist depth</text>
    </g>

    <g transform="translate(328 126)">
      <rect width="250" height="206" rx="10" fill="#151d35" stroke="#51f0a5" stroke-width="3"/>
      <rect x="20" y="20" width="36" height="36" fill="#51f0a5"/>
      <rect x="28" y="28" width="20" height="20" fill="#151d35"/>
      <text x="74" y="45" fill="#51f0a5" font-size="17" font-weight="700">REMEMBER</text>
      <text x="20" y="90" fill="#e8edff" font-size="14">developer</text>
      <text x="20" y="114" fill="#e8edff" font-size="14">project</text>
      <text x="20" y="138" fill="#e8edff" font-size="14">session</text>
      <text x="20" y="174" fill="#9aa9ca" font-size="12">less rediscovery</text>
    </g>

    <g transform="translate(600 126)">
      <rect width="250" height="206" rx="10" fill="#151d35" stroke="#ffcf5c" stroke-width="3"/>
      <rect x="20" y="20" width="36" height="36" fill="#ffcf5c"/>
      <rect x="28" y="28" width="20" height="20" fill="#151d35"/>
      <text x="74" y="45" fill="#ffcf5c" font-size="17" font-weight="700">SPECIALIZE</text>
      <text x="20" y="90" fill="#e8edff" font-size="13">FE • BE • AI</text>
      <text x="20" y="114" fill="#e8edff" font-size="13">mobile • design</text>
      <text x="20" y="138" fill="#e8edff" font-size="13">DB • test • security</text>
      <text x="20" y="174" fill="#9aa9ca" font-size="12">depth when earned</text>
    </g>

    <g transform="translate(872 126)">
      <rect width="250" height="206" rx="10" fill="#151d35" stroke="#ff6bd6" stroke-width="3"/>
      <rect x="20" y="20" width="36" height="36" fill="#ff6bd6"/>
      <rect x="28" y="28" width="20" height="20" fill="#151d35"/>
      <text x="74" y="45" fill="#ff6bd6" font-size="17" font-weight="700">PROVE</text>
      <text x="20" y="90" fill="#e8edff" font-size="14">root cause first</text>
      <text x="20" y="118" fill="#e8edff" font-size="14">fresh tests</text>
      <text x="20" y="146" fill="#e8edff" font-size="14">course correct</text>
      <text x="20" y="174" fill="#9aa9ca" font-size="12">less repair work</text>
    </g>

    <text x="56" y="376" fill="#64759b" font-size="12">goal: lower total work • correctness stays primary • live A/B claims only after real runs</text>
