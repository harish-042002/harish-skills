<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <rect width="1200" height="400" fill="#f8f4e8"/>
  <rect x="24" y="24" width="1152" height="352" rx="18" fill="#fffdf6" stroke="#4e5b52" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" shape-rendering="crispEdges">
    <text x="58" y="72" fill="#33443b" font-size="23" font-weight="700">WHY PLAT?</text>
    <text x="58" y="98" fill="#728078" font-size="13">the USP is context economics, not “more instructions”</text>

    <g transform="translate(58 130)">
      <rect width="250" height="180" fill="#eaf0e5" stroke="#687a6d" stroke-width="3"/>
      <text x="22" y="35" fill="#3f5145" font-size="17" font-weight="700">ADAPT</text>
      <text x="22" y="70" fill="#52685a" font-size="12">small task</text>
      <text x="22" y="92" fill="#2f6940" font-size="12">→ small context</text>
      <text x="22" y="126" fill="#52685a" font-size="12">hard task</text>
      <text x="22" y="148" fill="#7a5a32" font-size="12">→ specialist depth</text>
    </g>

    <g transform="translate(330 130)">
      <rect width="250" height="180" fill="#e3edf6" stroke="#6b8093" stroke-width="3"/>
      <text x="22" y="35" fill="#425c70" font-size="17" font-weight="700">REMEMBER</text>
      <text x="22" y="74" fill="#587084" font-size="12">developer</text>
      <text x="22" y="98" fill="#587084" font-size="12">project</text>
      <text x="22" y="122" fill="#587084" font-size="12">session</text>
      <text x="22" y="152" fill="#6e7e8a" font-size="11">less rediscovery</text>
    </g>

    <g transform="translate(602 130)">
      <rect width="250" height="180" fill="#eee4f4" stroke="#816e86" stroke-width="3"/>
      <text x="22" y="35" fill="#62516a" font-size="17" font-weight="700">SPECIALIZE</text>
      <text x="22" y="74" fill="#75637d" font-size="12">FE · BE · AI</text>
      <text x="22" y="98" fill="#75637d" font-size="12">mobile · test</text>
      <text x="22" y="122" fill="#75637d" font-size="12">DB · security · design</text>
      <text x="22" y="152" fill="#7d6e82" font-size="11">load when earned</text>
    </g>

    <g transform="translate(874 130)">
      <rect width="250" height="180" fill="#f4e8d9" stroke="#94795e" stroke-width="3"/>
      <text x="22" y="35" fill="#70543c" font-size="17" font-weight="700">PROVE</text>
      <text x="22" y="74" fill="#816b56" font-size="12">root cause first</text>
      <text x="22" y="98" fill="#816b56" font-size="12">fresh verification</text>
      <text x="22" y="122" fill="#816b56" font-size="12">course correct</text>
      <text x="22" y="152" fill="#8b7866" font-size="11">less repair work</text>
    </g>

    <text x="58" y="344" fill="#78867e" font-size="12">correctness stays primary · efficiency is measured end-to-end</text>
  </g>
</svg>