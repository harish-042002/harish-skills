<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8f4e8"/>
  <rect x="24" y="24" width="1152" height="472" rx="18" fill="#fffdf6" stroke="#4e5b52" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" shape-rendering="crispEdges">
    <text x="58" y="72" fill="#33443b" font-size="23" font-weight="700">HOW THE OFFICE ROUTES WORK</text>
    <text x="58" y="98" fill="#728078" font-size="13">request + repo truth decide which rooms open</text>

    <!-- rooms -->
    <g font-size="12" font-weight="700">
      <g transform="translate(58 132)">
        <rect width="188" height="112" fill="#eaf0e5" stroke="#687a6d" stroke-width="3"/>
        <text x="24" y="34" fill="#3f5145">1 · MODE</text>
        <text x="24" y="60" fill="#68786d" font-size="10">build · debug · review</text>
        <text x="24" y="78" fill="#68786d" font-size="10">research · design</text>
        <text x="24" y="96" fill="#68786d" font-size="10">optimize · migrate</text>
      </g>
      <g transform="translate(282 132)">
        <rect width="188" height="112" fill="#e3edf6" stroke="#6b8093" stroke-width="3"/>
        <text x="24" y="34" fill="#425c70">2 · DEPTH</text>
        <text x="24" y="60" fill="#708596" font-size="10">quick · standard</text>
        <text x="24" y="78" fill="#708596" font-size="10">deep · research</text>
      </g>
      <g transform="translate(506 132)">
        <rect width="290" height="112" fill="#efe9f2" stroke="#816e86" stroke-width="3"/>
        <text x="24" y="34" fill="#62516a">3 · SPECIALIST ROOMS</text>
        <text x="24" y="60" fill="#7c6d81" font-size="10">FE · BE · AI · MOBILE · DB · API</text>
        <text x="24" y="78" fill="#7c6d81" font-size="10">TEST · SECURITY · PERF · DELIVERY</text>
        <text x="24" y="96" fill="#7c6d81" font-size="10">DESIGN · DEBUG · SYSTEM DESIGN</text>
      </g>
      <g transform="translate(832 132)">
        <rect width="310" height="112" fill="#f4e8d9" stroke="#94795e" stroke-width="3"/>
        <text x="24" y="34" fill="#70543c">4 · PROVE + REMEMBER</text>
        <text x="24" y="60" fill="#8b745f" font-size="10">fresh evidence before done</text>
        <text x="24" y="78" fill="#8b745f" font-size="10">project + session context reused</text>
        <text x="24" y="96" fill="#8b745f" font-size="10">repo truth always wins</text>
      </g>
    </g>

    <!-- route line -->
    <path d="M112 278 H1086" stroke="#c9bea9" stroke-width="6" stroke-dasharray="14 10"/>
    <rect x="110" y="268" width="18" height="18" fill="#6f90a5">
      <animate attributeName="x" values="110;355;610;885;1080;110" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- profile shelf -->
    <g transform="translate(154 334)">
      <rect width="892" height="104" rx="8" fill="#f6f0e5" stroke="#b9ad98" stroke-width="2"/>
      <text x="24" y="28" fill="#5f6d64" font-size="11">OPTIONAL CONTEXT SHELF — caches, never authority</text>
      <rect x="24" y="46" width="250" height="34" fill="#dfeaf6"/><text x="40" y="68" fill="#425c70">~/.plat/profile.md</text>
      <rect x="320" y="46" width="250" height="34" fill="#dceee0"/><text x="336" y="68" fill="#3f5145">.plat/project.md</text>
      <rect x="616" y="46" width="250" height="34" fill="#eee4f4"/><text x="632" y="68" fill="#62516a">.plat/session.md</text>
    </g>
  </g>
</svg>