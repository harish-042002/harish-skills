<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490">
  <rect width="1200" height="490" fill="#090d1a"/>
  <rect x="18" y="18" width="1164" height="454" rx="18" fill="#10172a" stroke="#273454" stroke-width="4"/>
  <g font-family="monospace" shape-rendering="crispEdges">
    <text x="56" y="68" fill="#f6ff77" font-size="22" font-weight="700">PLAT WORLD MAP</text>
    <text x="56" y="95" fill="#8797b8" font-size="13">one control plane • specialist zones load only when earned</text>

    <!-- track -->
    <path d="M100 188 H1080 M100 326 H1080" stroke="#24314f" stroke-width="8" stroke-dasharray="12 10"/>

    <!-- nodes -->
    <g font-size="13" font-weight="700">
      <g transform="translate(60 142)">
        <rect width="160" height="92" rx="8" fill="#17203b" stroke="#7df9ff" stroke-width="3"/>
        <text x="22" y="34" fill="#7df9ff">REQUEST</text>
        <text x="22" y="58" fill="#9aa9ca" font-size="11">goal + repo truth</text>
      </g>

      <g transform="translate(260 142)">
        <rect width="180" height="92" rx="8" fill="#17203b" stroke="#ff6bd6" stroke-width="3"/>
        <text x="22" y="34" fill="#ff6bd6">MODE + DEPTH</text>
        <text x="22" y="58" fill="#9aa9ca" font-size="11">quick / standard</text>
        <text x="22" y="75" fill="#9aa9ca" font-size="11">deep / research</text>
      </g>

      <g transform="translate(480 126)">
        <rect width="250" height="124" rx="8" fill="#17203b" stroke="#51f0a5" stroke-width="3"/>
        <text x="22" y="30" fill="#51f0a5">SPECIALIST ZONES</text>
        <text x="22" y="56" fill="#d9e2ff" font-size="12">BE  FE  AI  MOBILE</text>
        <text x="22" y="78" fill="#d9e2ff" font-size="12">DB  API  TEST  SECURITY</text>
        <text x="22" y="100" fill="#d9e2ff" font-size="12">PERF  DELIVERY  DESIGN</text>
      </g>

      <g transform="translate(770 142)">
        <rect width="170" height="92" rx="8" fill="#17203b" stroke="#ffcf5c" stroke-width="3"/>
        <text x="22" y="34" fill="#ffcf5c">THIN SLICE</text>
        <text x="22" y="58" fill="#9aa9ca" font-size="11">smallest valid work</text>
      </g>

      <g transform="translate(980 142)">
        <rect width="150" height="92" rx="8" fill="#17203b" stroke="#7df9ff" stroke-width="3"/>
        <text x="22" y="34" fill="#7df9ff">PROVE</text>
        <text x="22" y="58" fill="#9aa9ca" font-size="11">fresh evidence</text>
      </g>
    </g>

    <!-- lower memory layer -->
    <g transform="translate(180 286)">
      <rect width="840" height="92" rx="8" fill="#0c1327" stroke="#3b4e78" stroke-width="2"/>
      <text x="28" y="28" fill="#a6b7dc" font-size="12">OPTIONAL CONTEXT CACHE — never stronger than current repository evidence</text>
      <g font-size="13" font-weight="700">
        <rect x="28" y="46" width="220" height="28" fill="#1a2440"/><text x="42" y="65" fill="#ff6bd6">~/.plat/profile.md</text>
        <rect x="278" y="46" width="250" height="28" fill="#1a2440"/><text x="292" y="65" fill="#51f0a5">.plat/project.md</text>
        <rect x="558" y="46" width="250" height="28" fill="#1a2440"/><text x="572" y="65" fill="#ffcf5c">.plat/session.md</text>
      </g>
    </g>

    <!-- moving pixel -->
    <rect x="104" y="180" width="16" height="16" fill="#f6ff77">
      <animate attributeName="x" values="104;285;520;805;1010;1080;104" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#7df9ff;#ff6bd6;#51f0a5;#ffcf5c;#7df9ff;#f6ff77;#7df9ff" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="56" y="430" fill="#64759b" font-size="12">USP: adaptive depth + specialist brains + project memory + proof-first engineering</text>
  </g>
</svg>