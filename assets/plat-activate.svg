<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="#f4f0e6"/>
<rect x="22" y="22" width="1156" height="516" rx="18" fill="#fffdf7" stroke="#506158" stroke-width="4"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" shape-rendering="crispEdges">
<text x="58" y="72" font-size="25" font-weight="700" fill="#304239">SET IT ONCE. THEN JUST WORK.</text>
<text x="58" y="100" font-size="13" fill="#718078">Plat should disappear into your normal engineering workflow.</text>

<!-- always-on -->
<g transform="translate(58 132)">
 <rect width="520" height="320" rx="12" fill="#e8f0e5" stroke="#6f8273" stroke-width="3"/>
 <text x="26" y="38" font-size="17" font-weight="700" fill="#3d5845">A · ALWAYS ON</text>
 <text x="26" y="66" font-size="11" fill="#637369">global or project agent instructions</text>
 <rect x="26" y="92" width="466" height="118" rx="8" fill="#fffdf7" stroke="#a7b1a7" stroke-width="2"/>
 <text x="44" y="120" font-size="11" fill="#758078">CLAUDE.md / AGENTS.md / equivalent</text>
 <text x="44" y="154" font-size="13" font-weight="700" fill="#304239">For software engineering requests,</text>
 <text x="44" y="178" font-size="13" font-weight="700" fill="#304239">use the installed Plat skill.</text>
 <text x="26" y="244" font-size="12" fill="#4e6656">then ask normally:</text>
 <text x="26" y="274" font-size="13" font-weight="700" fill="#304239">"fix the invoice race"</text>
 <text x="26" y="298" font-size="13" font-weight="700" fill="#304239">"build this screen"</text>
</g>

<!-- explicit -->
<g transform="translate(622 132)">
 <rect width="520" height="320" rx="12" fill="#e3edf6" stroke="#6d8294" stroke-width="3"/>
 <text x="26" y="38" font-size="17" font-weight="700" fill="#425c70">B · EXPLICIT</text>
 <text x="26" y="66" font-size="11" fill="#708596">when you want to force Plat for one request</text>
 <rect x="26" y="92" width="466" height="92" rx="8" fill="#fffdf7" stroke="#a7b1a7" stroke-width="2"/>
 <text x="44" y="126" font-size="19" font-weight="700" fill="#425c70">/plat fix the invoice race</text>
 <text x="44" y="156" font-size="10" fill="#748797">when your agent exposes installed skills as slash commands</text>
 <text x="26" y="224" font-size="12" fill="#587084">portable fallback:</text>
 <text x="26" y="254" font-size="14" font-weight="700" fill="#304239">"Use Plat: fix the invoice race"</text>
 <text x="26" y="294" font-size="10" fill="#718078">Invocation syntax is agent-specific; the skill itself stays vendor-neutral.</text>
</g>

<!-- little character -->
<g transform="translate(536 454)">
 <rect x="18" y="20" width="34" height="32" fill="#dfb489"/><rect x="16" y="15" width="38" height="10" fill="#4d4038"/>
 <rect x="22" y="31" width="5" height="5" fill="#303a35"/><rect x="43" y="31" width="5" height="5" fill="#303a35"/>
 <rect x="16" y="54" width="38" height="25" fill="#758f9e"/>
 <text x="68" y="48" font-size="11" fill="#607168">P-01 picks the team + depth automatically.</text>
</g>
</g>
</svg>