<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="#f3efe4"/>
<rect x="18" y="18" width="1164" height="524" rx="18" fill="#fffdf7" stroke="#4d5d54" stroke-width="4"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" shape-rendering="crispEdges">
  <text x="54" y="68" font-size="27" font-weight="700" fill="#2f4238">ONE COMMAND · COMPLETE SETUP</text>
  <text x="54" y="98" font-size="13" fill="#6d7d73">the recommended installer handles skill placement + verification + preferences + agent wiring</text>

  <!-- terminal -->
  <g transform="translate(54 132)">
    <rect width="430" height="300" rx="10" fill="#34433d"/>
    <rect width="430" height="34" rx="10" fill="#4b5b54"/>
    <circle cx="22" cy="17" r="5" fill="#d76e61"/>
    <circle cx="40" cy="17" r="5" fill="#d6a84c"/>
    <circle cx="58" cy="17" r="5" fill="#6ba878"/>
    <text x="78" y="21" font-size="10" fill="#c8d3cd">plat installer</text>

    <text x="24" y="70" font-size="11" fill="#e7efe9">$ run Plat installer</text>
    <text x="24" y="100" font-size="10" fill="#9fc6aa">✓ choose agent</text>
    <text x="24" y="124" font-size="10" fill="#9fc6aa">✓ choose global / project</text>
    <text x="24" y="148" font-size="10" fill="#9fc6aa">✓ direct copy into real agent path</text>
    <text x="24" y="172" font-size="10" fill="#9fc6aa">✓ verify SKILL.md exists</text>
    <text x="24" y="196" font-size="10" fill="#9fc6aa">✓ run developer preferences</text>
    <text x="24" y="220" font-size="10" fill="#9fc6aa">✓ wire CLAUDE.md / AGENTS.md / Cursor rule</text>
    <rect x="24" y="246" width="8" height="14" fill="#8ec49a">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- flow cards -->
  <g transform="translate(530 132)">
    <rect width="610" height="300" rx="10" fill="#f2eee5" stroke="#aaa08f" stroke-width="2"/>

    <g transform="translate(24 28)">
      <rect width="168" height="74" rx="7" fill="#e3edf6" stroke="#6d8394" stroke-width="2"/>
      <text x="18" y="28" font-size="11" font-weight="700" fill="#425d70">1 · AGENT</text>
      <text x="18" y="50" font-size="9" fill="#708596">Claude · Codex · Cursor</text>
    </g>

    <g transform="translate(220 28)">
      <rect width="168" height="74" rx="7" fill="#e8f0e5" stroke="#6f8273" stroke-width="2"/>
      <text x="18" y="28" font-size="11" font-weight="700" fill="#3d5845">2 · SCOPE</text>
      <text x="18" y="50" font-size="9" fill="#65766a">global · project</text>
    </g>

    <g transform="translate(416 28)">
      <rect width="168" height="74" rx="7" fill="#f3e7d7" stroke="#987a5d" stroke-width="2"/>
      <text x="18" y="28" font-size="11" font-weight="700" fill="#705239">3 · VERIFY</text>
      <text x="18" y="50" font-size="9" fill="#8a745e">real skill path exists</text>
    </g>

    <g transform="translate(122 132)">
      <rect width="168" height="82" rx="7" fill="#eee4f3" stroke="#876f91" stroke-width="2"/>
      <text x="18" y="28" font-size="11" font-weight="700" fill="#654e6e">4 · ONBOARD</text>
      <text x="18" y="50" font-size="9" fill="#817087">3 preference choices</text>
      <text x="18" y="66" font-size="9" fill="#817087">+ optional stack</text>
    </g>

    <g transform="translate(318 132)">
      <rect width="168" height="82" rx="7" fill="#e4efe3" stroke="#6b836f" stroke-width="2"/>
      <text x="18" y="28" font-size="11" font-weight="700" fill="#3d5845">5 · WIRE</text>
      <text x="18" y="50" font-size="9" fill="#65766a">Plat becomes default</text>
      <text x="18" y="66" font-size="9" fill="#65766a">for engineering requests</text>
    </g>

    <path d="M108 102V125H206M304 102V125H206M500 102V125H402M290 173H318" stroke="#b6aa98" stroke-width="4" stroke-dasharray="8 6"/>

    <rect x="116" y="244" width="376" height="34" rx="6" fill="#fffdf7" stroke="#9da99f" stroke-width="2"/>
    <text x="138" y="266" font-size="10" font-weight="700" fill="#2f4238">DONE → ask normally; Plat chooses the team + depth</text>
  </g>

  <text x="54" y="486" font-size="11" fill="#718078">Installer uses copy mode and verifies the destination so a “successful” install cannot silently miss the agent path.</text>
</g>
</svg>