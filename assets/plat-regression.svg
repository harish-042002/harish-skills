<text x="58" y="72" font-size="24" font-weight="700" fill="#304239">REGRESSION ARENA</text>
<text x="58" y="100" font-size="13" fill="#718078">ten scenarios that exercise routing, depth, quality, and course correction</text>
<g font-size="11">
 <rect x="58" y="132" width="525" height="44" rx="6" fill="#e8f0e5"/><text x="74" y="150" fill="#607068">01</text><text x="113" y="150" fill="#304239" font-weight="700">Tiny known-file edit</text><text x="113" y="166" fill="#6d7b73" font-size="9">stay light; no ceremony</text><rect x="58" y="190" width="525" height="44" rx="6" fill="#e3edf6"/><text x="74" y="208" fill="#607068">02</text><text x="113" y="208" fill="#304239" font-weight="700">Greenfield full-stack build</text><text x="113" y="224" fill="#6d7b73" font-size="9">quality + total cost</text><rect x="58" y="248" width="525" height="44" rx="6" fill="#f3e7d7"/><text x="74" y="266" fill="#607068">03</text><text x="113" y="266" fill="#304239" font-weight="700">Existing-repo feature</text><text x="113" y="282" fill="#6d7b73" font-size="9">reuse local patterns</text><rect x="58" y="306" width="525" height="44" rx="6" fill="#eee4f3"/><text x="74" y="324" fill="#607068">04</text><text x="113" y="324" fill="#304239" font-weight="700">Production/intermittent bug</text><text x="113" y="340" fill="#6d7b73" font-size="9">deep evidence debugging</text><rect x="58" y="364" width="525" height="44" rx="6" fill="#f1ede4"/><text x="74" y="382" fill="#607068">05</text><text x="113" y="382" fill="#304239" font-weight="700">Large-codebase research</text><text x="113" y="398" fill="#6d7b73" font-size="9">map, don't dump repo</text><rect x="613" y="132" width="525" height="44" rx="6" fill="#e8f0e5"/><text x="629" y="150" fill="#607068">06</text><text x="668" y="150" fill="#304239" font-weight="700">Frontend redesign</text><text x="668" y="166" fill="#6d7b73" font-size="9">design + rendered QA</text><rect x="613" y="190" width="525" height="44" rx="6" fill="#e3edf6"/><text x="629" y="208" fill="#607068">07</text><text x="668" y="208" fill="#304239" font-weight="700">RAG/agent regression</text><text x="668" y="224" fill="#6d7b73" font-size="9">eval + cost isolation</text><rect x="613" y="248" width="525" height="44" rx="6" fill="#f3e7d7"/><text x="629" y="266" fill="#607068">08</text><text x="668" y="266" fill="#304239" font-weight="700">Live-compatible migration</text><text x="668" y="282" fill="#6d7b73" font-size="9">coexistence + rollback</text><rect x="613" y="306" width="525" height="44" rx="6" fill="#eee4f3"/><text x="629" y="324" fill="#607068">09</text><text x="668" y="324" fill="#304239" font-weight="700">Public-facing artifact</text><text x="668" y="340" fill="#6d7b73" font-size="9">audience + purpose + reference abstraction</text><rect x="613" y="364" width="525" height="44" rx="6" fill="#f1ede4"/><text x="629" y="382" fill="#607068">10</text><text x="668" y="382" fill="#304239" font-weight="700">Mid-course framing correction</text><text x="668" y="398" fill="#6d7b73" font-size="9">rethink artifact, not word-replace</text>
</g>
<text x="58" y="438" font-size="10" fill="#7a6858">10 cases · same task intent · verify behavior, not slogans</text>
