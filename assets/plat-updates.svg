<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<rect width="1200" height="500" fill="#f3efe4"/>
<rect x="18" y="18" width="1164" height="464" rx="18" fill="#fffdf7" stroke="#4d5d54" stroke-width="4"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" shape-rendering="crispEdges">
  <text x="54" y="68" font-size="27" font-weight="700" fill="#2f4238">UPDATES WITHOUT ENGINEERING-SESSION COST</text>
  <text x="54" y="98" font-size="13" fill="#6d7d73">one background check every 24h · no prompt tokens · no agent tool call</text>

  <g transform="translate(54 132)">
    <rect width="300" height="230" rx="10" fill="#e3edf6" stroke="#6d8394" stroke-width="3"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#425d70">1 · DAILY CHECK</text>
    <rect x="78" y="60" width="144" height="116" rx="8" fill="#fffdf7" stroke="#718899" stroke-width="3"/>
    <rect x="94" y="42" width="18" height="34" fill="#718899"/>
    <rect x="188" y="42" width="18" height="34" fill="#718899"/>
    <rect x="94" y="86" width="112" height="10" fill="#dbe7ef"/>
    <text x="113" y="130" font-size="28" font-weight="700" fill="#425d70">24h</text>
    <circle cx="236" cy="64" r="7" fill="#6ca879">
      <animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="202" font-size="9" fill="#708596">GitHub Releases API only</text>
    <text x="20" y="218" font-size="9" fill="#708596">runs outside coding sessions</text>
  </g>

  <path d="M370 246H432" stroke="#b7ab99" stroke-width="5" stroke-dasharray="9 7"/>

  <g transform="translate(444 132)">
    <rect width="300" height="230" rx="10" fill="#eee4f3" stroke="#876f91" stroke-width="3"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#654e6e">2 · CACHE + NOTIFY</text>
    <rect x="70" y="62" width="160" height="92" rx="8" fill="#fffdf7" stroke="#8b7692" stroke-width="3"/>
    <rect x="88" y="82" width="124" height="9" fill="#ded1e3"/>
    <rect x="88" y="102" width="100" height="9" fill="#ded1e3"/>
    <rect x="88" y="122" width="114" height="9" fill="#ded1e3"/>
    <circle cx="238" cy="70" r="7" fill="#d18154">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="184" font-size="9" fill="#817087">~/.plat/update-status.json</text>
    <text x="20" y="202" font-size="9" fill="#817087">OS notification only if newer</text>
    <text x="20" y="218" font-size="9" fill="#817087">same version → silent</text>
  </g>

  <path d="M760 246H822" stroke="#b7ab99" stroke-width="5" stroke-dasharray="9 7"/>

  <g transform="translate(834 132)">
    <rect width="312" height="230" rx="10" fill="#e8f0e5" stroke="#6f8273" stroke-width="3"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#3d5845">3 · UPDATE WHEN READY</text>
    <rect x="22" y="60" width="268" height="94" rx="7" fill="#34433d"/>
    <text x="38" y="88" font-size="9" fill="#dce9e1">$ same Plat installer</text>
    <text x="38" y="112" font-size="9" fill="#9fc6aa">✓ latest skill copied</text>
    <text x="38" y="134" font-size="9" fill="#9fc6aa">✓ profile preserved</text>
    <text x="20" y="184" font-size="9" fill="#65766a">no silent mid-session replacement</text>
    <text x="20" y="202" font-size="9" fill="#65766a">one scheduler handles all installs</text>
    <text x="20" y="218" font-size="9" fill="#65766a">global + project paths registered</text>
  </g>

  <rect x="54" y="398" width="1092" height="42" rx="7" fill="#f1ede4" stroke="#aaa08f" stroke-width="2"/>
  <text x="74" y="416" font-size="9" fill="#5f7066">NETWORK PRIVACY</text>
  <text x="74" y="431" font-size="9" fill="#5f7066">checker sends no prompts, code, profile, or project data — only a normal GitHub release request</text>
</g>
</svg>