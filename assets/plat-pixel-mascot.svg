<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#090d1a"/>
  <rect x="18" y="18" width="1164" height="524" rx="18" fill="#10172a" stroke="#273454" stroke-width="4"/>
  <g opacity=".25">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200M0 360H1200M0 432H1200M72 0V560M144 0V560M216 0V560M288 0V560M360 0V560M432 0V560M504 0V560M576 0V560M648 0V560M720 0V560M792 0V560M864 0V560M936 0V560M1008 0V560M1080 0V560" stroke="#18223d" stroke-width="2"/>
  </g>

  <g font-family="monospace" shape-rendering="crispEdges">
    <text x="64" y="82" fill="#7df9ff" font-size="26" font-weight="700">PLAT v1.0</text>
    <text x="64" y="114" fill="#9aa9ca" font-size="15">adaptive engineering control plane</text>

    <!-- stars -->
    <g fill="#f6ff77">
      <rect x="1040" y="68" width="8" height="8"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="1100" y="130" width="6" height="6"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="960" y="176" width="6" height="6"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="94" y="420" width="7" height="7"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- mascot -->
    <g transform="translate(130 170)">
      <animateTransform attributeName="transform" type="translate" values="130 170;130 160;130 170" dur="2.4s" repeatCount="indefinite"/>
      <!-- shadow -->
      <rect x="44" y="286" width="180" height="18" rx="8" fill="#050816" opacity=".7">
        <animate attributeName="width" values="180;150;180" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="44;59;44" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <!-- antenna -->
      <rect x="126" y="0" width="16" height="32" fill="#ff6bd6"/>
      <rect x="118" y="-12" width="32" height="16" fill="#ffcf5c"/>
      <!-- ears -->
      <rect x="20" y="72" width="30" height="64" fill="#5f72ff"/>
      <rect x="218" y="72" width="30" height="64" fill="#5f72ff"/>
      <!-- head -->
      <rect x="48" y="34" width="172" height="132" fill="#7df9ff"/>
      <rect x="62" y="50" width="144" height="102" fill="#18223d"/>
      <!-- eyes -->
      <rect x="88" y="80" width="26" height="26" fill="#f6ff77">
        <animate attributeName="height" values="26;26;4;26;26" keyTimes="0;.46;.5;.54;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="154" y="80" width="26" height="26" fill="#f6ff77">
        <animate attributeName="height" values="26;26;4;26;26" keyTimes="0;.46;.5;.54;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <!-- mouth/status -->
      <rect x="96" y="126" width="76" height="10" fill="#ff6bd6"/>
      <!-- body -->
      <rect x="74" y="170" width="120" height="82" fill="#5f72ff"/>
      <rect x="94" y="188" width="80" height="44" fill="#10172a"/>
      <rect x="106" y="200" width="12" height="12" fill="#51f0a5"/>
      <rect x="130" y="200" width="12" height="12" fill="#ffcf5c"/>
      <rect x="154" y="200" width="8" height="12" fill="#ff6bd6"/>
      <!-- arms -->
      <rect x="42" y="178" width="30" height="62" fill="#7df9ff"/>
      <rect x="196" y="178" width="30" height="62" fill="#7df9ff"/>
      <rect x="24" y="230" width="48" height="20" fill="#ffcf5c"/>
      <rect x="196" y="230" width="48" height="20" fill="#ffcf5c"/>
      <!-- feet -->
      <rect x="86" y="252" width="44" height="28" fill="#ff6bd6"/>
      <rect x="138" y="252" width="44" height="28" fill="#ff6bd6"/>
    </g>

    <!-- route chips -->
    <g font-size="13" font-weight="700">
      <g transform="translate(390 150)">
        <rect width="132" height="38" rx="6" fill="#17203b" stroke="#51f0a5" stroke-width="2"/>
        <text x="20" y="25" fill="#51f0a5">BUILD</text>
      </g>
      <g transform="translate(540 150)">
        <rect width="132" height="38" rx="6" fill="#17203b" stroke="#ff6bd6" stroke-width="2"/>
        <text x="20" y="25" fill="#ff6bd6">DEBUG</text>
      </g>
      <g transform="translate(690 150)">
        <rect width="132" height="38" rx="6" fill="#17203b" stroke="#ffcf5c" stroke-width="2"/>
        <text x="18" y="25" fill="#ffcf5c">RESEARCH</text>
      </g>
      <g transform="translate(840 150)">
        <rect width="132" height="38" rx="6" fill="#17203b" stroke="#7df9ff" stroke-width="2"/>
        <text x="23" y="25" fill="#7df9ff">DESIGN</text>
      </g>
    </g>

    <!-- speech terminal -->
    <g transform="translate(390 215)">
      <rect width="730" height="238" rx="12" fill="#0c1327" stroke="#3b4e78" stroke-width="3"/>
      <rect width="730" height="40" rx="12" fill="#17203b"/>
      <circle cx="24" cy="20" r="6" fill="#ff6b6b"/>
      <circle cx="44" cy="20" r="6" fill="#ffcf5c"/>
      <circle cx="64" cy="20" r="6" fill="#51f0a5"/>
      <text x="94" y="26" fill="#9aa9ca" font-size="13">plat://how-i-work</text>

      <g>
        <text x="34" y="82" fill="#7df9ff" font-size="20" font-weight="700">01 / ROUTE</text>
        <text x="34" y="112" fill="#e8edff" font-size="18">small task → small brain</text>
        <text x="34" y="140" fill="#9aa9ca" font-size="15">hard task → specialist depth</text>
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.20;.25;.95;.96;.99;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="34" y="82" fill="#ff6bd6" font-size="20" font-weight="700">02 / REMEMBER</text>
        <text x="34" y="112" fill="#e8edff" font-size="18">developer + project + session</text>
        <text x="34" y="140" fill="#9aa9ca" font-size="15">reuse verified context, not stale assumptions</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.28;.46;.50;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="34" y="82" fill="#51f0a5" font-size="20" font-weight="700">03 / SPECIALIZE</text>
        <text x="34" y="112" fill="#e8edff" font-size="18">FE • BE • AI • mobile • test • design</text>
        <text x="34" y="140" fill="#9aa9ca" font-size="15">load only the depth that can change the outcome</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.53;.71;.75;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="34" y="82" fill="#ffcf5c" font-size="20" font-weight="700">04 / PROVE</text>
        <text x="34" y="112" fill="#e8edff" font-size="18">fresh evidence before “done”</text>
        <text x="34" y="140" fill="#9aa9ca" font-size="15">correctness first • efficiency second</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.78;.96;1" dur="12s" repeatCount="indefinite"/>
      </g>

      <!-- progress -->
      <rect x="34" y="180" width="650" height="12" fill="#18223d"/>
      <rect x="34" y="180" width="80" height="12" fill="#7df9ff">
        <animate attributeName="width" values="80;210;370;520;650;80" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#7df9ff;#ff6bd6;#51f0a5;#ffcf5c;#7df9ff" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="34" y="222" fill="#6f83ad" font-size="13">less rediscovery • less rework • bounded context • stronger proof</text>
    </g>

    <text x="64" y="510" fill="#64759b" font-size="13">pixel mascot: P-01 • STATUS: adaptive • SOURCE: repository truth</text>
  </g>
</svg>