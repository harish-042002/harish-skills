<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f8f4e8"/>
  <rect x="24" y="24" width="1152" height="572" rx="18" fill="#fffdf6" stroke="#4e5b52" stroke-width="4"/>
  <g shape-rendering="crispEdges" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="58" y="76" font-size="27" font-weight="700" fill="#33443b">PLAT v1 · ENGINEERING OFFICE</text>
    <text x="58" y="104" font-size="14" fill="#708077">one small office character · many specialist rooms · only the room you need opens</text>

    <!-- soft tiled office floor -->
    <g stroke="#e6dfcf" stroke-width="2">
      <path d="M50 150H1150M50 220H1150M50 290H1150M50 360H1150M50 430H1150M50 500H1150"/>
      <path d="M120 130V548M210 130V548M300 130V548M390 130V548M480 130V548M570 130V548M660 130V548M750 130V548M840 130V548M930 130V548M1020 130V548M1110 130V548"/>
    </g>

    <!-- office plants / props -->
    <g>
      <rect x="78" y="430" width="52" height="48" fill="#b7794f"/>
      <rect x="88" y="390" width="14" height="42" fill="#5f8667"/>
      <rect x="104" y="378" width="14" height="54" fill="#7aa57c"/>
      <rect x="120" y="396" width="12" height="36" fill="#5f8667"/>
      <rect x="1065" y="426" width="56" height="52" fill="#b7794f"/>
      <rect x="1075" y="384" width="14" height="44" fill="#5f8667"/>
      <rect x="1093" y="372" width="14" height="56" fill="#7aa57c"/>
    </g>

    <!-- specialist sticky notes -->
    <g font-size="12" font-weight="700">
      <g transform="translate(74 160)">
        <rect width="130" height="66" fill="#dceee0" stroke="#627d68" stroke-width="2"/>
        <text x="16" y="26" fill="#395141">BACKEND</text><text x="16" y="46" fill="#6c7e70" font-size="10">distributed depth</text>
      </g>
      <g transform="translate(222 160)">
        <rect width="130" height="66" fill="#dfeaf6" stroke="#677e98" stroke-width="2"/>
        <text x="20" y="26" fill="#3f566d">FRONTEND</text><text x="16" y="46" fill="#74869a" font-size="10">state + runtime</text>
      </g>
      <g transform="translate(848 160)">
        <rect width="130" height="66" fill="#f4e7d6" stroke="#987a5d" stroke-width="2"/>
        <text x="28" y="26" fill="#6e5238">AI / RAG</text><text x="18" y="46" fill="#8f7966" font-size="10">eval + economics</text>
      </g>
      <g transform="translate(996 160)">
        <rect width="130" height="66" fill="#eee4f4" stroke="#866d91" stroke-width="2"/>
        <text x="24" y="26" fill="#654d70">DESIGN</text><text x="18" y="46" fill="#8e7797" font-size="10">v0.7 retained</text>
      </g>
    </g>

    <!-- desk -->
    <rect x="414" y="352" width="370" height="30" fill="#9d7556"/>
    <rect x="438" y="382" width="24" height="116" fill="#74563f"/>
    <rect x="736" y="382" width="24" height="116" fill="#74563f"/>
    <rect x="520" y="284" width="170" height="92" fill="#455550"/>
    <rect x="536" y="300" width="138" height="60" fill="#dceee0"/>
    <text x="552" y="326" fill="#33443b" font-size="12">task → route</text>
    <text x="552" y="346" fill="#567064" font-size="11">proof → done</text>
    <rect x="586" y="376" width="38" height="14" fill="#455550"/>

    <!-- original pixel character P-01 -->
    <g transform="translate(525 390)">
      <animateTransform attributeName="transform" type="translate" values="525 390;525 388;525 390" dur="3.2s" repeatCount="indefinite"/>
      <!-- chair -->
      <rect x="48" y="94" width="92" height="62" fill="#66766f"/>
      <rect x="68" y="148" width="12" height="50" fill="#56655f"/>
      <rect x="108" y="148" width="12" height="50" fill="#56655f"/>
      <!-- body -->
      <rect x="50" y="72" width="88" height="76" fill="#6f90a5"/>
      <rect x="66" y="82" width="56" height="34" fill="#f0dcc4"/>
      <!-- head -->
      <rect x="54" y="8" width="82" height="72" fill="#e5b990"/>
      <rect x="46" y="16" width="16" height="42" fill="#4b3c34"/>
      <rect x="128" y="18" width="16" height="40" fill="#4b3c34"/>
      <rect x="60" y="2" width="68" height="18" fill="#4b3c34"/>
      <!-- eyes blink -->
      <rect x="72" y="36" width="9" height="9" fill="#2f3934">
        <animate attributeName="height" values="9;9;2;9;9" keyTimes="0;.47;.5;.53;1" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="108" y="36" width="9" height="9" fill="#2f3934">
        <animate attributeName="height" values="9;9;2;9;9" keyTimes="0;.47;.5;.53;1" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="84" y="58" width="22" height="5" fill="#7f5a48"/>
      <!-- arms typing -->
      <rect x="26" y="92" width="30" height="14" fill="#e5b990">
        <animate attributeName="y" values="92;96;92" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="134" y="92" width="30" height="14" fill="#e5b990">
        <animate attributeName="y" values="96;92;96" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- keyboard -->
    <rect x="545" y="414" width="112" height="20" fill="#d8d1c4" stroke="#5f675f" stroke-width="2"/>

    <!-- speech card -->
    <g transform="translate(360 500)">
      <rect width="480" height="62" rx="8" fill="#f2eadc" stroke="#7d8c82" stroke-width="2"/>
      <text x="22" y="26" fill="#33443b" font-size="14" font-weight="700">P-01: “small task, small brain. hard task, right specialist.”</text>
      <text x="22" y="46" fill="#6f7d74" font-size="11">verified project context is reused; stale assumptions are not.</text>
    </g>

    <!-- tiny status lights -->
    <circle cx="1130" cy="72" r="7" fill="#6aa870">
      <animate attributeName="opacity" values="1;.45;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1040" y="77" fill="#708077" font-size="11">STATUS: READY</text>
  </g>
</svg>