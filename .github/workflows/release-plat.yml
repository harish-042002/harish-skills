name: Release Plat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - skills/plat/VERSION

concurrency:
  group: release-plat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Plat
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/validate_plat.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Package Plat
        shell: bash
        run: |
          set -euo pipefail
          find skills/plat -type d -name __pycache__ -prune -exec rm -rf {} +
          find skills/plat -type f -name '*.pyc' -delete
          cd skills
          zip -qr ../skill.zip plat
          cd ..
          sha256sum skill.zip > SHA256SUMS.txt
          if unzip -l skill.zip | grep -E '(__pycache__|\.pyc$)'; then
            echo "Packaged skill contains Python bytecode/cache files" >&2
            exit 1
          fi

      - name: Upload packaged skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: plat-skill-${{ steps.version.outputs.version }}
          path: |
            skill.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          printf '# Plat %s\n\n' "$TAG" > release-notes.md
          cat >> release-notes.md <<'EOF'
          Adaptive engineering control plane for AI coding agents.

          ## Install

          macOS / Linux:

          ```bash
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.sh)"
          ```

          Windows PowerShell:

          ```powershell
          iex (irm 'https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.ps1')
          ```

          ## Highlights

          - P-01 is now explicitly the lead engineering orchestrator for integrated work.
          - Manager-style orchestration is the default; true handoff is gated to genuinely separable specialist-owned interactions.
          - One-level delegation prevents recursive agent/skill fan-out.
          - External skills are discovered metadata-first; specific specialists are preferred over broad orchestrators.
          - Specialist communication uses bounded briefs and evidence-dense return contracts instead of shared full-chat context.
          - Specialist conflicts are resolved by current repo/runtime evidence and the smallest discriminating check, never majority vote.
          - Quick tasks use zero specialists; Standard normally uses zero; Deep starts with one; Research can parallelize up to three independent read-only specialists initially.
          - Shared mutations remain sequential unless explicit isolation exists.
          - Two unsuccessful rounds on the same unresolved question trigger re-localization/re-routing instead of another automatic dispatch.
          - Deterministic orchestration policy tests cover specialist caps, handoff gating, parallelism, external-skill selection, and circuit breakers.
          - Exhaustive invariant tests exercise more than 10,000 structured orchestration states.
          - Existing fast-path routing, vague-intent recovery, trajectory correction, developer preference onboarding, and once-daily out-of-band update checks remain intact.
          - Correctness/safety first; then minimize total tokens, tool calls, duplicate reads, repair turns, integration overhead, and wall time.

          The release asset `skill.zip` contains the complete Plat skill and MIT license.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Plat $TAG" --notes-file release-notes.md
            gh release upload "$TAG" skill.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" skill.zip SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Plat $TAG" \
              --notes-file release-notes.md
          fi
