name: Release Plat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release-plat.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Plat
        shell: bash
        run: |
          set -euo pipefail
          cd skills
          zip -qr ../skill.zip plat
          cd ..
          sha256sum skill.zip > SHA256SUMS.txt

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          printf '# Plat %s\n\n' "$TAG" > release-notes.md
          cat >> release-notes.md <<'EOF'
          Adaptive engineering control plane for AI coding agents.

          ## Install

          macOS / Linux:

          ```bash
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.sh)"
          ```

          Windows PowerShell:

          ```powershell
          iex (irm 'https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.ps1')
          ```

          ## Highlights

          - Verified direct-copy installation into the selected agent's real skill directory.
          - Mandatory one-time developer preference onboarding for interactive users.
          - Onboarding is preference-only: role, experience, response style, optional familiar stack.
          - Engineering depth remains evidence-driven; asking for a deep answer does not force expensive specialist loading.
          - Correctness/safety first; then minimize total tokens, tool calls, rereads, repair turns, and wall time.
          - Re-running the installer updates Plat while preserving the existing developer profile.
          - GitHub Release notifications provide update awareness without per-task network/token overhead.

          The release asset `skill.zip` contains the complete Plat skill and MIT license.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Plat $TAG" --notes-file release-notes.md
            gh release upload "$TAG" skill.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" skill.zip SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "Plat $TAG"               --notes-file release-notes.md
          fi
