name: Release Plat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - skills/plat/VERSION

concurrency:
  group: release-plat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluation dependencies
        run: python -m pip install -r benchmarks/requirements.txt

      - name: Validate Plat
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/validate_plat.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Package Plat
        shell: bash
        run: |
          set -euo pipefail
          find skills/plat -type d -name __pycache__ -prune -exec rm -rf {} +
          find skills/plat -type f -name '*.pyc' -delete
          cd skills
          zip -qr ../skill.zip plat
          cd ..
          sha256sum skill.zip > SHA256SUMS.txt
          if unzip -l skill.zip | grep -E '(__pycache__|\.pyc$)'; then
            echo "Packaged skill contains Python bytecode/cache files" >&2
            exit 1
          fi

      - name: Upload packaged skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: plat-skill-${{ steps.version.outputs.version }}
          path: |
            skill.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          printf '# Plat %s\n\n' "$TAG" > release-notes.md
          cat >> release-notes.md <<'EOF'
          Adaptive engineering control plane for AI coding agents.

          ## Install

          macOS / Linux:

          ```bash
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.sh)"
          ```

          Windows PowerShell:

          ```powershell
          iex (irm 'https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.ps1')
          ```

          ## Highlights

          - Minimal ordinary execution; deeper runtime helpers remain optional.
          - Context occupancy is separate from cumulative cache and read traffic.
          - Lossless evidence continuation, complete binding constraints, and bounded optional commands.
          - Corrected usage accounting and independent benchmark verifiers.
          - 166 local regression tests and runtime-helper timings; no verified end-to-end model cost or speed gain.
          - Version 2.4.0-rc.2 is a benchmark candidate, not a stable-quality certification.

          The release asset `skill.zip` contains the complete Plat skill and MIT license.
          EOF

          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${RELEASE_FLAGS[@]}" --title "Plat $TAG" --notes-file release-notes.md
            gh release upload "$TAG" skill.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" skill.zip SHA256SUMS.txt "${RELEASE_FLAGS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Plat $TAG" \
              --notes-file release-notes.md
          fi
