name: Release Plat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release-plat.yml

concurrency:
  group: release-plat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Plat
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/validate_plat.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Package Plat
        shell: bash
        run: |
          set -euo pipefail
          find skills/plat -type d -name __pycache__ -prune -exec rm -rf {} +
          find skills/plat -type f -name '*.pyc' -delete
          cd skills
          zip -qr ../skill.zip plat
          cd ..
          sha256sum skill.zip > SHA256SUMS.txt
          if unzip -l skill.zip | grep -E '(__pycache__|\.pyc$)'; then
            echo "Packaged skill contains Python bytecode/cache files" >&2
            exit 1
          fi

      - name: Upload packaged skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: plat-skill-${{ steps.version.outputs.version }}
          path: |
            skill.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          printf '# Plat %s\n\n' "$TAG" > release-notes.md
          cat >> release-notes.md <<'EOF'
          Adaptive engineering control plane for AI coding agents.

          ## Install

          macOS / Linux:

          ```bash
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.sh)"
          ```

          Windows PowerShell:

          ```powershell
          iex (irm 'https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.ps1')
          ```

          ## Highlights

          - Fast routing hot path reduced to a compact always-loaded control plane.
          - Vague messages resolve from active conversation/workspace/repository evidence before clarification.
          - One safe interpretation -> act; materially different unresolved interpretations -> one focused question.
          - Local / Behavioral / Structural correction levels prevent stale trajectory lock-in.
          - Structural corrections invalidate dependent decisions and re-route the affected slice.
          - Repository discovery now has explicit stop conditions and risk-first history/blast-radius checks.
          - Specialist loading uses a strict budget: one primary reference first, one deep specialist when earned.
          - Failed fixes retire disproven hypotheses instead of stacking patches.
          - Market-first maintenance protocol requires external skill research, license review, adaptation, regression testing, and evidence logging before material Plat changes.
          - Correctness/safety first; then minimize total tokens, tool calls, rereads, repair turns, coordination, and wall time.
          - Deep/Research tasks can federate to already-installed specialist skills instead of copying every specialty into Plat.
          - External skills are discovered metadata-first and consulted one best match at a time only when a concrete unresolved capability remains.
          - P-01 remains the lead orchestrator: specialists exchange bounded evidence packets and disagreements are resolved by current repo/runtime evidence, not voting.
          - Quick and ordinary Standard tasks normally invoke zero external skills, protecting speed and context.
          - One user-level background checker checks GitHub Releases once every 24 hours outside engineering sessions.
          - Update status is cached locally and an OS notification appears only when a newer release exists; Plat does not silently replace itself mid-session.

          The release asset `skill.zip` contains the complete Plat skill and MIT license.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Plat $TAG" --notes-file release-notes.md
            gh release upload "$TAG" skill.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" skill.zip SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Plat $TAG" \
              --notes-file release-notes.md
          fi
