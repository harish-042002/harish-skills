name: Release Plat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release-plat.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Plat
        run: python scripts/validate_plat.py

      - name: Package Plat
        shell: bash
        run: |
          set -euo pipefail
          cd skills
          zip -qr ../skill.zip plat
          cd ..
          sha256sum skill.zip > SHA256SUMS.txt

      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          printf '# Plat %s\n\n' "$TAG" > release-notes.md
          cat >> release-notes.md <<'EOF'
          Adaptive engineering control plane for AI coding agents.

          ## Install

          macOS / Linux:

          ```bash
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.sh)"
          ```

          Windows PowerShell:

          ```powershell
          iex (irm 'https://raw.githubusercontent.com/harish-042002/harish-skills/main/install.ps1')
          ```

          ## Highlights

          - Fast routing hot path reduced to a compact always-loaded control plane.
          - Vague messages resolve from active conversation/workspace/repository evidence before clarification.
          - One safe interpretation -> act; materially different unresolved interpretations -> one focused question.
          - Local / Behavioral / Structural correction levels prevent stale trajectory lock-in.
          - Structural corrections invalidate dependent decisions and re-route the affected slice.
          - Repository discovery now has explicit stop conditions and risk-first history/blast-radius checks.
          - Specialist loading uses a strict budget: one primary reference first, one deep specialist when earned.
          - Failed fixes retire disproven hypotheses instead of stacking patches.
          - Market-first maintenance protocol requires external skill research, license review, adaptation, regression testing, and evidence logging before material Plat changes.
          - Correctness/safety first; then minimize total tokens, tool calls, rereads, repair turns, coordination, and wall time.

          The release asset `skill.zip` contains the complete Plat skill and MIT license.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Plat $TAG" --notes-file release-notes.md
            gh release upload "$TAG" skill.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" skill.zip SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "Plat $TAG"               --notes-file release-notes.md
          fi
